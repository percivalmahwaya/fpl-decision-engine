name: Publish the static site

# The static front end, served by GitHub Pages.
#
# DELIBERATELY A SEPARATE WORKFLOW FROM fpl.yml, which is the clock for the
# whole system and has been running unattended for weeks. Deployment is a
# different job with different permissions and a different failure mode: if
# Pages is misconfigured or the deploy times out, the pipeline that collects
# data, predicts, alerts and emails must not go red with it. Those runs go
# quiet when they fail, and a red cron does not email anybody.
#
# It triggers on the same commits regardless, because fpl.yml pushes its JSON
# to main and that push starts this. So the site follows the data by a minute
# or two without the two jobs ever being able to take each other down.
#
# WHAT PERCIVAL HAS TO DO ONCE: repository Settings, Pages, set Source to
# "GitHub Actions". Until then this workflow fails on the deploy step with a
# clear message and nothing else is affected.

on:
  # THE ONE THAT ACTUALLY KEEPS THE SITE CURRENT.
  #
  # The `push` trigger below does NOT fire for the pipeline's own commits.
  # GitHub deliberately refuses to start a workflow from a push made with
  # GITHUB_TOKEN, to stop a job that commits from retriggering itself
  # forever. fpl.yml commits site/data twice a day with exactly that token,
  # so relying on `push` alone meant the site froze at whatever data existed
  # the last time a human pushed, while the deploy stayed green and reported
  # success. Found by pushing and watching it not happen.
  #
  # `workflow_run` is the supported way out: it fires when another workflow
  # finishes, whatever started it. It only ever triggers from the default
  # branch, which is where the pipeline runs.
  workflow_run:
    workflows: ["FPL pipeline"]
    types: [completed]

  # Still useful for a change to the page itself, pushed by a person.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read the repository, write a Pages deployment, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer commit wins. The pipeline can push
# twice within a minute if a run is retried, and there is no value in
# publishing an older snapshot after a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A failed pipeline leaves site/data untouched, so there is nothing new to
    # publish. The two other triggers carry no workflow_run payload, so they
    # must not be caught by this.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is a directory of files that are already correct in git.
      # There is no build step and there is not meant to be one: the whole
      # argument for this page is that it ships what is in the repository.
      - name: Check the site is intact before publishing it
        run: |
          test -f site/index.html
          test -f site/assets/app.js
          test -f site/assets/pfl.css
          test -f site/data/meta.json
          echo "site weight:"
          du -sh site
          du -b site/index.html site/assets/app.js site/assets/pfl.css | \
            awk '{ s += $1 } END { printf "  page shell: %.0f KB\n", s/1024 }'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
