name: FPL pipeline

# The clock for the whole system.
#
# Streamlit Community Cloud has no scheduler and sleeps after 12 quiet hours,
# so nothing there can be trusted to run on time. This workflow does the work
# — collect, predict, alert, email — and commits a few hundred KB of JSON that
# the web app simply renders.
#
# 05:17 UTC  catches overnight news and gives several hours' warning before a
#            Saturday 11:30/12:30 deadline.
# 18:17 UTC  catches the afternoon press conferences, which is when most
#            injury news actually lands.
#
# NOT ON THE HOUR, AND THIS WAS MEASURED. The first scheduled run used
# `0 6 * * *` and GitHub delivered it at 10:06 UTC — four hours late. Shared
# runners are heavily oversubscribed at :00, and GitHub's scheduler drops or
# delays triggers under load. An odd minute is far less contended. The delay
# is still best-effort, never guaranteed, which is why the email window below
# is wide enough to absorb a late run.

on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 18 * * *'
  workflow_dispatch:          # lets you run it by hand before a deadline

permissions:
  contents: write             # needed to commit site/data and update the release

concurrency:
  # Two runs writing fpl.db to the same release asset would race and one would
  # silently lose its snapshot. Never cancel in progress — a half-finished run
  # that already uploaded the database is worse than a slow one.
  group: fpl-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mapped to env so later steps can test them in `if:` conditions —
      # secrets cannot be referenced directly there. Job level, never step
      # level: an `if:` cannot see a step's own env block, which is exactly how
      # a deploy step in the sibling progeny-app workflow was silently disabled.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Job level, not on the one step that fetches with it. qa_deploy.py also
      # reads this to tell "not configured" apart from "configured and broken",
      # and scoped to a single step it could not see it: the fetch succeeded
      # while the QA gate reported the id as unset, in the same run.
      FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      # ---------------------------------------------------------------
      # The database is 23 MB and grows. Committing it twice a day would
      # bloat git history permanently, so it lives as a release asset:
      # downloaded at the start of a run, uploaded at the end.
      # ---------------------------------------------------------------
      - name: Restore database from release
        id: restore
        run: |
          if gh release download data --pattern fpl.db --clobber 2>/dev/null; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            ls -lh fpl.db
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No stored database found — this run will bootstrap one."
          fi

      # Most scripts in this repo print their docstring and exit 0 when given
      # no mode flag. `python backfill_history.py` therefore "succeeded" while
      # loading nothing, and the failure only surfaced four steps later as
      # "Training on 0 historical rows". The flag is required, and the row
      # count is asserted rather than assumed.
      - name: Bootstrap history (first run only)
        if: steps.restore.outputs.restored == 'false'
        run: |
          python backfill_history.py --load
          python - <<'PY'
          import sqlite3, sys
          n = sqlite3.connect("fpl.db").execute(
              "SELECT COUNT(*) FROM history").fetchone()[0]
          print(f"history rows after bootstrap: {n:,}")
          if n < 100_000:
              sys.exit("Bootstrap produced too few rows — refusing to continue.")
          PY

      - name: Take snapshot
        run: python fpl_collect.py

      - name: Backfill finished gameweek results
        run: python predict.py --backfill

      # MUST run after the backfill. What each pick actually scored lives in
      # player_gw, which the step above fills, and this step reads it. Ordered
      # the other way round, as it was until 2026-09-15, a freshly finished
      # gameweek is always recorded with null scores and only corrects itself
      # on the next run twelve hours later.
      #
      # FPL_ENTRY_ID turns this from replaying a hand transcription into a real
      # fetch of his own team. Without it the script says so loudly and
      # qa_deploy raises a warning; with it set but failing, qa_deploy FAILS,
      # because a benchmark that has silently stopped updating is worse than no
      # benchmark at all. That is precisely what happened here: this step went
      # green twice a day for over a week while recording nothing new.
      #
      # A VARIABLE, not a secret. An entry id is not a credential and every FPL
      # team is already publicly viewable by id.
      - name: Record squad and results
        run: python record_my_team.py

      - name: Baseline predictions
        run: python predict.py --predict

      - name: Score any gameweek that has now finished
        run: python predict.py --score

      - name: Model predictions and recommendation
        run: python recommend.py --run

      - name: Availability alerts
        run: python alert.py --check --hours 24

      - name: Publish JSON for the web app
        run: python publish.py --print

      # QA runs BEFORE anything is committed or emailed. A failing check stops
      # the run, so bad data never reaches the public page or your inbox.
      - name: QA gate
        run: |
          python qa.py --all
          python qa_deploy.py

      # Retries on a rejected push.
      #
      # The push was bare, so any commit landing on main between this run's
      # checkout and its push lost the run: the step failed, the pipeline went
      # red, and that gameweek's published JSON was simply not committed. It
      # happened on 2026-09-15 when a scheduled run collided with a push from
      # a laptop. Harmless in itself, since the next run republishes, but a
      # pipeline that goes red for a benign race is a pipeline people learn to
      # ignore, and this one is the gate in front of the email.
      #
      # Rebase rather than merge: these are data commits on top of whatever is
      # on main, never a divergent history worth a merge commit.
      - name: Commit published data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "data: GW${{ github.run_number }} refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt. Rebasing onto origin/main."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed. Refusing to force. The next run republishes."
              exit 1
            }
            sleep $((attempt * 5))
          done
          echo "Still rejected after 3 attempts."
          exit 1

      - name: Store database back to release
        run: |
          python fpl_collect.py --prune
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Database" \
              --notes "Rolling fpl.db snapshot. Regenerable — see README."
          gh release upload data fpl.db --clobber

      - name: Decide whether to notify
        id: notify
        # `should_email` keeps its name: it is a published field that
        # qa_deploy.py asserts on, and renaming it would change the public
        # JSON contract for a cosmetic gain. It means "is there something
        # worth sending", and has been channel-neutral since the move off mail.
        run: |
          echo "send=$(jq -r '.should_email' site/data/notify.json)" >> "$GITHUB_OUTPUT"
          echo "subject=$(jq -r '.subject' site/data/notify.json)" >> "$GITHUB_OUTPUT"
          jq -r '.body' site/data/notify.json > notify_body.txt
          cat notify_body.txt

      - name: Telegram
        # Skipped silently when the bot secrets are absent, so the pipeline
        # still works before they are set up — the same contract the mail step
        # had. The condition reads JOB-level env (see the env block above);
        # a step-level env is invisible to `if:` and would disable this
        # silently rather than loudly.
        if: steps.notify.outputs.send == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          # Telegram rejects the whole message above 4096 characters rather
          # than truncating it, so the text is cut here. Cut in Python, by
          # character: `head -c` cuts bytes and would split a multi-byte name
          # like Kovačić in half and produce invalid UTF-8.
          python - <<'PY' > telegram_text.txt
          import json
          d = json.load(open("site/data/notify.json", encoding="utf-8"))
          print((d["subject"] + "\n\n" + d["body"])[:3900])
          PY

          # No parse_mode: the body carries player names and figures, and
          # Telegram's Markdown parser rejects an unbalanced _ or * in them by
          # failing the entire send. Plain text cannot fail that way.
          response=$(curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@telegram_text.txt" \
            --data "disable_web_page_preview=true")

          # Telegram answers HTTP 200 and reports its own failures in the body.
          # A zero exit from curl therefore proves only that something replied,
          # which is the same "a status code is not a verification" trap this
          # project has hit on a deploy, on a release and on a squad fetch.
          if [ "$(printf '%s' "$response" | jq -r '.ok')" != "true" ]; then
            echo "Telegram refused the message:"
            printf '%s' "$response" | jq -r '.description // "no description returned"'
            exit 1
          fi
          echo "Delivered to Telegram."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fpl-debug-${{ github.run_number }}
          path: |
            site/data/
            fpl.db
          retention-days: 5
